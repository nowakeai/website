name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync project docs
        run: npm run sync:docs

      - name: Check synced docs
        run: npm run check:docs

      - name: Build
        run: npm run build
